name: Build AltServer Image

# Publishes a self-contained AltServer image to ghcr.io/<owner>/altserver-linux, so a Portainer
# stack can just pull it instead of building on the host.
#
# Uses ${{ github.repository_owner }} rather than a hardcoded namespace, so a fork publishes to
# its OWN namespace and does not fail against someone else's — which is exactly the mistake
# build_docker.yml makes by hardcoding ghcr.io/nyamisty.

on:
  push:
    branches:
      - new
      - bd/revival
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      # The web UI is COPIED into the image, so changes to it must rebuild it. Omitting this
      # meant five commits of web fixes silently never reached a published image, and the
      # deployed stack kept serving known-broken code with no indication anything was stale.
      - 'web/**'
      - 'src/**'
      - 'shims/**'
      - 'makefiles/**'
      # The same failure as web/** above, one level down. The libraries/ submodules
      # (libimobiledevice, libusbmuxd, libplist, libimobiledevice-glue, ideviceinstaller) and the
      # plain sources in libraries/dnssd_loader are COMPILED into the -static binary by the build
      # stage's `make`, so bumping one changes the SHIPPED BINARY. Without this entry the image
      # would keep the old binary and nothing would indicate it was stale.
      - 'libraries/**'
      - 'Makefile'
      - 'upstream_repo'
      - '.github/workflows/build_image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner: GHCR rejects uppercase in image names, and GitHub usernames may
      # contain capitals (Ben-Diehlci does).
      - name: Compute image name
        id: name
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/altserver-linux" >> "$GITHUB_OUTPUT"

      # amd64 only for now. The build stage pulls an ARCH-SPECIFIC alpine builder image, so a
      # multi-arch build needs a per-arch BUILDER arg rather than a plain platforms: list —
      # buildx would otherwise run the amd64 toolchain under emulation and still emit an amd64
      # binary, producing an image that is mislabelled rather than merely slow.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILDER=ghcr.io/nyamisty/altserver_builder_alpine_amd64
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed ${{ steps.name.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The package is PRIVATE by default. To let Portainer pull it without credentials," >> "$GITHUB_STEP_SUMMARY"
          echo "make it public once: GitHub -> Packages -> altserver-linux -> Package settings ->" >> "$GITHUB_STEP_SUMMARY"
          echo "Change visibility -> Public." >> "$GITHUB_STEP_SUMMARY"
